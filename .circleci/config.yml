# Python CircleCI 2.0 configuration file
#
# Check https://circleci.com/docs/2.0/language-python/ for more details
#
version: 2
jobs:
  build_docs:
    docker:
      # https://github.com/dante-ev/docker-texlive
      - image: danteev/texlive

    working_directory: ~/checkout

    environment:
      PIP_INSTALL: python3 -m pip install --user --progress-bar off --upgrade
      CONFIGURE_FLAGS: --disable-ecasound --disable-gui --disable-ip-interface --disable-websocket-interface --disable-fudi-interface --enable-browser-gui

    steps:
      - checkout

      - run:
          name: Checkout Submodules
          command: |
            git submodule update --init

      - run:
          name: Set $PATH (for Python entry points)
          command: |
            echo 'export PATH=~/.local/bin:$PATH' >> $BASH_ENV

      - run:
          name: Installing apt Packages
          command: |
            curl -sS https://dl.yarnpkg.com/debian/pubkey.gpg | apt-key add -
            echo "deb https://dl.yarnpkg.com/debian/ stable main" | tee /etc/apt/sources.list.d/yarn.list
            apt-get update
            apt-get install -y \
              automake \
              binutils \
              doxygen \
              help2man \
              libfftw3-dev \
              libjack-jackd2-dev \
              libsndfile1-dev \
              libxml2-dev \
              pkg-config \
              python3-pip \
              yarn

      - run:
          name: Installing Python Packages
          command: |
            $PIP_INSTALL -r doc/manual/requirements.txt

      - run:
          name: Configuring SSR
          command: |
            ./autogen.sh
            ./configure --disable-dependency-tracking $CONFIGURE_FLAGS

      - store_artifacts:
          name: Uploading config.log
          path: config.log
          destination: config.log

      - run:
          name: Building the SSR
          command: |
            make

      - store_artifacts:
          name: Uploading Browser GUI files
          path: data/websocket_resources
          destination: browser-gui

      - run:
          name: Building HTML Manual
          command: |
            cd doc/manual
            make html -W --keep-going

      - run:
          name: Building PDF Manual
          command: |
            cd doc/manual
            make latexpdf

      # NB: The PDF manual must be built before creating the tarball!
      - run:
          name: Creating tarball
          command: |
            make distcheck DISTCHECK_CONFIGURE_FLAGS="$CONFIGURE_FLAGS"
            mkdir ~/tarball
            cp ssr-*.tar.gz ~/tarball

      - store_artifacts:
          name: Uploading tarball
          path: ~/tarball
          destination: .

      - persist_to_workspace:
          root: ~/tarball
          paths:
            - ssr-*.tar.gz

      - run:
          name: Building Doxygen docs
          command: |
            make doc

      - store_artifacts:
          name: Uploading Doxygen HTML files
          path: doc/doxygen/html
          destination: doxygen

      - store_artifacts:
          name: Uploading HTML Manual
          path: doc/manual/_build/html
          destination: manual

      - store_artifacts:
          name: Uploading PDF Manual
          path: doc/manual/_build/latex/SoundScapeRenderer.pdf
          destination: SoundScapeRenderer.pdf

      - run:
          name: Check for broken links in User Manual
          command: |
            cd doc/manual
            make linkcheck -W --keep-going

      - store_artifacts:
          name: Uploading linkcheck results
          path: doc/manual/_build/linkcheck
          destination: linkcheck

  app_bundle:
    macos:
      xcode: "14.2.0"
    environment:
      HOMEBREW_NO_AUTO_UPDATE: 1
      CONFIGURE_FLAGS: --enable-ecasound --enable-gui --enable-ip-interface --enable-websocket-interface --enable-fudi-interface --enable-browser-gui --disable-intersense --enable-polhemus --enable-razor --enable-sofa --enable-vrpn

    steps:
      - run:
          name: Install macOS packages
          command: |
            PACKAGES=(
              asio
              ecasound
              fftw
              fmt
              jack
              SoundScapeRenderer/ssr/libmysofa
              libsndfile
              libtool
              pkg-config
              qt@5
              vrpn
              websocketpp
            )
            brew install ${PACKAGES[@]}
            brew link qt@5 --force

      - attach_workspace:
          at: /tmp/tarball

      - run:
          name: Extracting the tarball
          command: |
            tar xvf /tmp/tarball/ssr-*.tar.gz

      - run:
          name: Configuring the SSR
          command: |
            cd ssr-*/
            ./configure --enable-app-bundle --disable-dependency-tracking $CONFIGURE_FLAGS

      - run:
          name: Building the SSR App Bundle and DMG
          command: |
            cd ssr-*/
            make dmg

      - run:
          # It seems that store_artifacts doesn't allow wildcards, so we move it to a directory:
          name: Moving DMG to directory
          command: |
            mkdir -p app-bundle
            mv ssr-*/SoundScapeRenderer-*.dmg app-bundle/

      - store_artifacts:
          name: Uploading DMG
          path: app-bundle
          destination: app-bundle

workflows:
  version: 2
  build-everything:
    jobs:
      - build_docs
      - app_bundle:
          requires:
            - build_docs
